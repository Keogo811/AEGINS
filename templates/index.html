<!-- ============ CONTENU ============ -->
<header>
    <h1>Alice</h1>
    <p class="souvenirs">Souvenirs en mémoire : {{ total }}</p>
</header>

<main id="conversation"></main>

<form id="formulaire">
    <button id="bouton-terminer" type="button" title="Terminer la session et écrire le journal">Terminer</button>
    <input type="text" id="saisie" autofocus autocomplete="off" placeholder="Écris à Alice...">
    <button type="submit">Envoyer</button>
</form>

<script>
    const conv = document.getElementById('conversation');
    const form = document.getElementById('formulaire');
    const saisie = document.getElementById('saisie');

    function scrollBas() { window.scrollTo(0, document.body.scrollHeight); }

    function bloc(role, nom, texte) {
        const div = document.createElement('div');
        div.className = 'message ' + role;
        const label = document.createElement('span');
        label.className = 'nom';
        label.textContent = nom;
        const contenu = document.createElement('div');
        contenu.className = 'contenu';
        contenu.textContent = texte;
        div.appendChild(label);
        div.appendChild(contenu);
        conv.appendChild(div);
        scrollBas();
        return div;
    }

    function blocPensee(texte) {
        const details = document.createElement('details');
        details.className = 'pensee';
        const summary = document.createElement('summary');
        summary.textContent = 'pensée interne';
        const contenu = document.createElement('div');
        contenu.className = 'contenu';
        contenu.textContent = texte;
        details.appendChild(summary);
        details.appendChild(contenu);
        conv.appendChild(details);
        scrollBas();
        return details;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = saisie.value.trim();
        if (!msg) return;
        saisie.value = '';

        bloc('toi', 'Toi', msg);

        const attente = bloc('alice', 'Alice', 'réfléchit…');
        attente.classList.add('attente');

        try {
            const r = await fetch('/parler', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });
            const data = await r.json();
            attente.remove();

            if (data.pensee) blocPensee(data.pensee);

            bloc('alice', 'Alice', data.reponse);
        } catch (err) {
            attente.remove();
            bloc('erreur', 'Erreur', err.message);
        }
    });
</script>

<script>
    const boutonTerminer = document.getElementById('bouton-terminer');
    boutonTerminer.addEventListener('click', async () => {
        boutonTerminer.disabled = true;
        const texteOriginal = boutonTerminer.textContent;
        boutonTerminer.textContent = 'Écriture…';
        try {
            const r = await fetch('/terminer', { method: 'POST' });
            const data = await r.json();
            boutonTerminer.textContent = data.ok ? 'Journal écrit' : 'Erreur';
            setTimeout(() => {
                boutonTerminer.textContent = texteOriginal;
                boutonTerminer.disabled = false;
            }, 4000);
        } catch (err) {
            boutonTerminer.textContent = 'Erreur';
            boutonTerminer.disabled = false;
        }
    });
</script>
